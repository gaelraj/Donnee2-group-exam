name: AQI Backfill Pipeline

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backfill start date YYYY-MM-DD"
        required: true
        default: "2026-02-21"
      end_date:
        description: "Backfill end date YYYY-MM-DD"
        required: true
        default: "2026-07-21"

permissions:
  contents: write

jobs:
  run-aqi-backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AQI backfill
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          python scripts/backfill_aqi.py \
            --start "${{ github.event.inputs.start_date }}" \
            --end "${{ github.event.inputs.end_date }}"

      - name: Rebuild clean CSV
        run: |
          python scripts/rebuild_clean.py

      - name: Validate clean CSV
        run: |
          python scripts/validate_clean.py

      - name: Load warehouse
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/load_warehouse.py

      - name: Commit backfill raw and clean files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw data/clean

          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "data: add 5 months AQI backfill"
            git push
          fi
      - name: Create warehouse schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/create_schema.py
