name: AQI Hourly Pipeline

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-aqi-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect current AQI raw data
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          python scripts/collect_current_aqi.py

      - name: Rebuild clean CSV
        run: |
          python scripts/rebuild_clean.py

      - name: Validate clean CSV
        run: |
          python scripts/validate_clean.py

      - name: Load warehouse
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/load_warehouse.py

      - name: Commit raw and clean files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw data/clean

          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "data: update AQI hourly data"
            git push
          fi


      - name: Create warehouse schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/create_schema.py
